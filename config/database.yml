# Conexão com o PostgreSQL.
#
# Uma única fonte de verdade: a URL completa vem da variável DATABASE_URL.
# - Em produção/container, o compose define DATABASE_URL apontando para `db:5432`.
# - Localmente (sem Docker), os defaults abaixo apontam para o Postgres exposto
#   na porta 5433 do host (ver docker-compose.yml).

default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL", "postgresql://rafael:password@localhost:5433/chiara_system") %>

test:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL", "postgresql://rafael:password@localhost:5433/chiara_system_test") %>

production:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL") %>
