services:
  # API Rails (JSON pura). Não publica porta para o host: só o Nginx fica exposto.
  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-rafael}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-chiara_system}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE ausente — copie .env.example para .env}

  # Banco de dados (cria usuário/banco na primeira subida via variáveis oficiais)
  db:
    image: postgres:13-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rafael}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-chiara_system}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Borda única: compila o React e serve via Nginx, fazendo proxy de /api para o Rails
  frontend:
    build:
      context: ./frontend/vite-project
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - web

volumes:
  pgdata:
