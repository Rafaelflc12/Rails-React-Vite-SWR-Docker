server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota que não seja um arquivo real cai no index.html,
    # e o React Router cuida do resto.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API: encaminha /api/* para o Rails (serviço `web` na rede do compose).
    # Sem barra no final do proxy_pass => a URI original é preservada.
    location /api/ {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
